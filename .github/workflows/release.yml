name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag override (e.g. v1.0.5). Leave blank to auto-bump patch.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Package Windows x64 Release (Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and bump release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputTag = "${{ inputs.tag }}".Trim()

          $pkgPath = "package.json"
          $tauriConfPath = "src-tauri/tauri.conf.json"
          $cargoTomlPath = "src-tauri/Cargo.toml"

          $pkg = Get-Content -Raw $pkgPath | ConvertFrom-Json
          $pkgVer = [version]$pkg.version

          if ($inputTag -ne "") {
            $cleanVer = $inputTag -replace '^v', ''
            $nextVer = [version]$cleanVer
          } else {
            git fetch --tags --force | Out-Null
            $tags = git tag --list "v*.*.*"
            $highestTagVer = $null

            foreach ($t in $tags) {
              if ($t -match '^v(\d+\.\d+\.\d+)$') {
                $v = [version]$Matches[1]
                if ($null -eq $highestTagVer -or $v -gt $highestTagVer) {
                  $highestTagVer = $v
                }
              }
            }

            if ($null -eq $highestTagVer) {
              $nextVer = $pkgVer
            } elseif ($pkgVer -gt $highestTagVer) {
              $nextVer = $pkgVer
            } else {
              $nextVer = [version]::new($highestTagVer.Major, $highestTagVer.Minor, $highestTagVer.Build + 1)
            }
          }

          $versionStr = "$($nextVer.Major).$($nextVer.Minor).$($nextVer.Build)"
          $tagStr = "v$versionStr"
          Write-Host "==> Resolved next release version: $versionStr (tag: $tagStr)" -ForegroundColor Cyan

          # Update package.json
          $pkgRaw = Get-Content -Raw $pkgPath
          $pkgRaw = [regex]::Replace($pkgRaw, '"version"\s*:\s*"[^"]+"', "`"version`": `"$versionStr`"", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $pkgPath), $pkgRaw, (New-Object System.Text.UTF8Encoding($false)))

          # Update src-tauri/tauri.conf.json
          $tauriRaw = Get-Content -Raw $tauriConfPath
          $tauriRaw = [regex]::Replace($tauriRaw, '"version"\s*:\s*"[^"]+"', "`"version`": `"$versionStr`"", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $tauriConfPath), $tauriRaw, (New-Object System.Text.UTF8Encoding($false)))

          # Update src-tauri/Cargo.toml
          $cargoRaw = Get-Content -Raw $cargoTomlPath
          $cargoRaw = [regex]::Replace($cargoRaw, '(?m)^version\s*=\s*"[^"]+"', "version = `"$versionStr`"", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $cargoTomlPath), $cargoRaw, (New-Object System.Text.UTF8Encoding($false)))

          "version=$versionStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tagStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and package Windows x64 Tauri release
        run: pnpm release:pack

      - name: Upload Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AiMY Meetings Desktop Client ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/AiMY-Meetings-Desktop-Client-*.zip
            release/AiMY-Meetings-Desktop-Client-*-setup.exe
            release/SHA256SUMS.txt
