[package]
name = "aimy-meetings"
version = "1.0.0"
description = "AiMY Meetings Desktop Client — desktop meeting recorder, DeepFilterNet3 speech enhancer and AiMY Knowledge sync companion"
authors = ["FlairsTech AiMY Team"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "process", "fs", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"

# Native audio capture (WASAPI mic + system loopback) and WAV I/O
cpal = "0.15"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
